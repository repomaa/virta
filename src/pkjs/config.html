<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Virta Settings</title>
<style>
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 16px; background: #111; color: #fff; }
h1 { font-size: 18px; text-align: center; margin: 0 0 20px; }
.field { background: #222; border-radius: 8px; padding: 12px 16px; margin-bottom: 12px; }
label { display: block; font-size: 12px; color: #aaa; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
select, input[type="range"] { width: 100%; font-size: 16px; background: #111; color: #fff; border: 1px solid #444; border-radius: 6px; padding: 8px; box-sizing: border-box; }
select { appearance: none; -webkit-appearance: none; }
.range-value { text-align: center; font-size: 18px; margin-top: 6px; font-weight: 600; }
.buttons { display: flex; gap: 12px; margin-top: 20px; }
button { flex: 1; font-size: 16px; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
.save { background: #0a0; color: #fff; }
.cancel { background: #444; color: #fff; }
</style>
</head>
<body>
<h1>Virta Settings</h1>
<div class="field">
  <label for="region">Region</label>
  <select id="region"></select>
</div>
<div class="field">
  <label for="range">Cheapest Window</label>
  <input type="range" id="range" min="1" max="24">
  <div class="range-value" id="rangeValue"></div>
</div>
<div class="buttons">
  <button class="cancel" onclick="cancel()">Cancel</button>
  <button class="save" onclick="save()">Save</button>
</div>
<script>
var regions = [
  {c: "DK1", n: "DK1 West"}, {c: "DK2", n: "DK2 East"}, {c: "EE", n: "Estonia"},
  {c: "FI", n: "Finland"}, {c: "LT", n: "Lithuania"}, {c: "LV", n: "Latvia"},
  {c: "NO1", n: "NO1 Ost"}, {c: "NO2", n: "NO2 Sor"}, {c: "NO3", n: "NO3 Mid"},
  {c: "NO4", n: "NO4 Nord"}, {c: "NO5", n: "NO5 Vest"}, {c: "SE1", n: "SE1 Lulea"},
  {c: "SE2", n: "SE2 Sundsvall"}, {c: "SE3", n: "SE3 Stockholm"}, {c: "SE4", n: "SE4 Malmo"}
];
var cfg = window.__cfg || {region: "FI", range: 3};
var sel = document.getElementById("region");
regions.forEach(function(r) {
  var o = document.createElement("option");
  o.value = r.c;
  o.textContent = r.n;
  if (r.c === cfg.region) o.selected = true;
  sel.appendChild(o);
});
var ri = document.getElementById("range");
var rv = document.getElementById("rangeValue");
ri.value = cfg.range;
rv.textContent = cfg.range + " h";
ri.addEventListener("input", function() {
  rv.textContent = ri.value + " h";
});
function save() {
  var s = {region: sel.value, range: parseInt(ri.value, 10)};
  location.href = "pebblejs://close#" + encodeURIComponent(JSON.stringify(s));
}
function cancel() {
  location.href = "pebblejs://close#";
}
</script>
</body>
</html>
